<title>Trobada Foixarda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Visor de partidos torneo 3 clubes: cabecera con escudos, barra de info, categorias, filtro por club */
:root{--bg:#eef1f5;--surface:#fff;--surface2:#f6f8fb;--fg:#15202e;--muted:#5d6b7b;--line:#d9dee7;
 --accent:#123f6e;--c8:#0f8a7e;--c10:#1f6fb2;--c12:#6d4bb0;--shadow:0 1px 2px rgba(20,32,48,.06),0 8px 22px rgba(20,32,48,.07)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--surface:#161e2b;--surface2:#1b2433;--fg:#e7edf4;--muted:#9aa7b7;--line:#2a3443;
 --accent:#5aa6e0;--c8:#3bc3b3;--c10:#5aa6e0;--c12:#a98be0;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1420;--surface:#161e2b;--surface2:#1b2433;--fg:#e7edf4;--muted:#9aa7b7;--line:#2a3443;
 --accent:#5aa6e0;--c8:#3bc3b3;--c10:#5aa6e0;--c12:#a98be0;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:"Barlow",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.4;font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--surface);border-bottom:1px solid var(--line);
 margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0 calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:720px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0 7px}
.brand .bt{display:flex;flex-direction:column}
.brand h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.45rem;margin:0;line-height:1.05}
.brand .date{font-size:.76rem;color:var(--muted);font-weight:600}
.crests{display:flex;align-items:center;gap:8px}
.crest{width:32px;height:32px;object-fit:contain}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1rem;letter-spacing:.03em;cursor:pointer;
 color:var(--muted);background:none;border:none;border-bottom:3px solid transparent;padding:10px 6px}
.tabs button.on{color:var(--cat);border-color:var(--cat)}
main{padding-top:14px}
.catwrap.sub8{--cat:var(--c8)}.catwrap.sub10{--cat:var(--c10)}.catwrap.sub12{--cat:var(--c12)}
.infobar{display:flex;flex-wrap:wrap;gap:10px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 4px;margin-bottom:14px}
.ib{flex:1 1 33%;min-width:120px;display:flex;align-items:center;gap:8px;padding:2px 12px;border-left:1px solid var(--line)}
.ib:first-child{border-left:none}
.ib .ic{font-size:1.05rem;line-height:1}
.ib .tx{display:flex;flex-direction:column;min-width:0}
.ib .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.ib .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.02rem}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.meta .tag{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:#fff;background:var(--cat);border-radius:7px;padding:3px 10px;font-size:1rem}
.meta .sub{font-size:.84rem;color:var(--muted)}
.ctrl{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
label.lbl{font-size:.8rem;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
select{font-family:inherit;font-size:.92rem;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 11px}
.franja{display:grid;grid-template-columns:50px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.franja:first-child{border-top:none}
.ft{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.12rem}
.ml{display:flex;flex-direction:column;gap:7px;min-width:0}
.m{display:grid;grid-template-columns:30px 1fr auto 1fr;align-items:center;gap:9px;background:var(--surface);
 border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);min-width:0}
.m.dim{opacity:.4}
.campo{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.72rem;color:#fff;background:var(--cat);border-radius:6px;text-align:center;padding:3px 0}
.loc{display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:0}
.vis{display:flex;align-items:center;gap:6px;min-width:0}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.nm.hl{color:var(--cat);font-weight:700}
.lg{width:19px;height:19px;object-fit:contain;flex:none}
.vs{color:var(--muted);font-size:.7rem;font-weight:700;font-family:"Barlow Condensed",sans-serif}
.note{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.83rem;color:var(--muted);margin-top:18px}
.foot{margin-top:20px;color:var(--muted);font-size:.78rem}
@media(max-width:460px){.franja{grid-template-columns:44px 1fr;gap:9px}.m{grid-template-columns:26px 1fr auto 1fr;gap:6px}.nm{font-size:.84rem}.ib{flex-basis:50%}.crest{width:26px;height:26px}.brand h1{font-size:1.2rem}}
</style>

const state={cat:DATA.cats[0].id,club:"all"};
function esc(s){return(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function club(t){return t.split(" - ")[0].trim()}
function logo(t){const u=LOGOS[club(t)];return u?`<img class="lg" src="${u}" alt="">`:""}
document.getElementById("tname").textContent=DATA.name;
document.getElementById("tdate").textContent=DATA.date||"";
document.getElementById("crests").innerHTML=DATA.clubs.map(c=>LOGOS[c]?`<img class="crest" src="${LOGOS[c]}" alt="${esc(c)}" title="${esc(c)}">`:"").join("");
const tabs=document.getElementById("tabs");
DATA.cats.forEach(c=>{const b=document.createElement("button");b.textContent=c.label;b.dataset.id=c.id;b.onclick=()=>{state.cat=c.id;render()};tabs.appendChild(b)});
function groupByTime(ms){const o={};ms.forEach(m=>{(o[m.t]=o[m.t]||[]).push(m)});return Object.keys(o).sort().map(t=>[t,o[t]])}
function infobar(info){
 const items=[["🏟","Camp(s)",info.camps],["🔄","Parts",info.parts],["⏸","Descans",info.descans],["🏃","Jugadors",info.jugadors],["📏","Mides",info.mides]];
 return `<div class="infobar">`+items.map(([ic,k,v])=>`<div class="ib"><span class="ic">${ic}</span><span class="tx"><span class="k">${k}</span><span class="v">${esc(v)}</span></span></div>`).join("")+`</div>`;
}
function render(){
 const c=DATA.cats.find(x=>x.id===state.cat);
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.id===state.cat));
 let clubOpts=`<option value="all">Todos los clubes</option>`+DATA.clubs.map(k=>`<option value="${esc(k)}" ${state.club===k?"selected":""}>${esc(k)}</option>`).join("");
 let body=`<div class="catwrap ${c.id}">`+infobar(c.info)+
  `<div class="meta"><span class="tag">${esc(c.label)}</span><span class="sub">${c.n} partidos · ${c.ini}–${c.fin}</span></div>`+
  `<div class="ctrl"><label class="lbl">Mi club <select id="clubsel">${clubOpts}</select></label></div>`;
 groupByTime(c.matches).forEach(([t,list])=>{
   body+=`<div class="franja"><div class="ft">${t}</div><div class="ml">`+list.map(m=>{
     const inv=state.club!=="all"&&club(m.a)!==state.club&&club(m.b)!==state.club;
     const h=x=>state.club!=="all"&&club(x)===state.club?"hl":"";
     return `<div class="m ${inv?"dim":""}"><span class="campo">${esc(m.campo)}</span>`+
       `<span class="loc"><span class="nm ${h(m.a)}">${esc(m.a)}</span>${logo(m.a)}</span>`+
       `<span class="vs">VS</span>`+
       `<span class="vis">${logo(m.b)}<span class="nm ${h(m.b)}">${esc(m.b)}</span></span></div>`;
   }).join("")+`</div></div>`;
 });
 body+=`<div class="note">2 partes de 7 min con 3 de descanso (entre partes y entre partidos) · 5 vs 5. Cada equipo juega 4 partidos, nunca contra su club y sin encadenar más de 2 seguidos.</div></div>`;
 document.getElementById("main").innerHTML=body;
 const cs=document.getElementById("clubsel");if(cs)cs.onchange=()=>{state.club=cs.value;render()};
 window.scrollTo(0,0);
}
render();
</script>
